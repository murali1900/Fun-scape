<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Scape International — Collectibles & Pop Culture</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFE212;
    --pink: #FF3FA4;
    --cyan: #00E5FF;
    --purple: #9B5CF6;
    --orange: #FF6B35;
    --green: #39FF14;
    --dark: #0A0A0F;
    --dark2: #12121A;
    --dark3: #1A1A26;
    --card-bg: #16161F;
    --text: #F0F0FF;
    --text-muted: #9090AA;
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 72px;
    background: rgba(10,10,15,0.88);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Bangers', cursive;
    font-size: 28px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--yellow), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 700; font-size: 14px; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--yellow); }

  .nav-cta {
    background: var(--yellow);
    color: var(--dark);
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 14px;
    padding: 10px 24px;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.15s;
  }
  .nav-cta:hover { transform: translateY(-2px); }

  .hero { position: relative; min-height: 80vh; display: flex; align-items: center; padding: 120px 48px 80px; overflow: hidden; }
  .hero-content { position: relative; z-index: 1; max-width: 800px; }
  
  h1 { font-family: 'Bangers', cursive; font-size: clamp(50px, 8vw, 100px); line-height: 0.95; margin-bottom: 24px; }
  h1 .line2 { background: linear-gradient(135deg, var(--yellow), var(--orange), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .ticker { background: var(--yellow); padding: 12px 0; overflow: hidden; white-space: nowrap; }
  .ticker-inner { display: inline-flex; animation: ticker 30s linear infinite; }
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .ticker-item { font-family: 'Bangers', cursive; color: var(--dark); padding: 0 30px; font-size: 18px; }

  section { padding: 80px 48px; position: relative; z-index: 1; }
  .section-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 10px; }
  .section-title { font-family: 'Bangers', cursive; font-size: clamp(36px, 5vw, 56px); margin-bottom: 40px; }

  .machines-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
  }

  .machine-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    transition: transform 0.3s ease;
  }
  .machine-card:hover { transform: translateY(-10px); border-color: var(--purple); }

  .machine-info { padding: 20px; }
  .machine-name { font-family: 'Bangers', cursive; font-size: 20px; margin-bottom: 8px; color: var(--yellow); }
  .machine-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
  }

  .product-card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: 0.3s;
    text-align: center;
  }
  .product-card:hover { border-color: var(--pink); transform: scale(1.02); }

  .product-img { width: 100%; height: 320px; object-fit: cover; background: #000; }
  .product-meta { padding: 15px; }
  .product-title { font-weight: 800; font-size: 16px; margin-bottom: 5px; color: var(--text); }
  .product-price { font-family: 'Bangers', cursive; color: var(--cyan); font-size: 22px; }

  .fade-up { opacity: 0; transform: translateY(30px); transition: 0.6s all ease; }
  .visible { opacity: 1 !important; transform: translateY(0) !important; }

  /* ── FOOTER RESTORE ── */
  footer {
    padding: 80px 48px 40px;
    border-top: 1px solid var(--border);
    background: var(--dark2);
    position: relative;
    z-index: 1;
  }

  .footer-top {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 48px;
    margin-bottom: 60px;
  }

  .footer-brand p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
    margin: 16px 0 24px;
    max-width: 320px;
  }

  .social-links { display: flex; gap: 12px; }
  .social-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; text-decoration: none; color: var(--text);
    transition: 0.2s;
  }
  .social-btn:hover { border-color: var(--yellow); transform: translateY(-3px); }

  .footer-col h4 {
    font-weight: 900; font-size: 14px;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 20px; color: var(--text);
  }

  .footer-col ul { list-style: none; }
  .footer-col ul li { margin-bottom: 10px; }
  .footer-col ul li a {
    color: var(--text-muted); text-decoration: none;
    font-size: 14px; font-weight: 600; transition: 0.2s;
  }
  .footer-col ul li a:hover { color: var(--yellow); }

  .footer-bottom {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 32px; border-top: 1px solid var(--border);
  }
  .footer-bottom p { font-size: 13px; color: var(--text-muted); }
  .footer-bottom span { color: var(--pink); }

  @media (max-width: 1024px) {
    .footer-top { grid-template-columns: 1fr 1fr; gap: 32px; }
  }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    section { padding: 40px 20px; }
    .footer-top { grid-template-columns: 1fr; }
    .footer-bottom { flex-direction: column; gap: 12px; text-align: center; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Fun Scape International</div>
  <ul class="nav-links">
    <li><a href="#machines">Vending Machines</a></li>
    <li><a href="#products">Catalog</a></li>
    <li><a href="https://wa.me/919000000000">Support</a></li>
  </ul>
  <button class="nav-cta">B2B Inquiry</button>
</nav>

<section class="hero">
  <div class="hero-content">
    <div class="section-label">Authentic Pop Culture Imports</div>
    <h1>COLLECT THE<br><span class="line2"> EXTRAORDINARY</span></h1>
    <p style="font-size: 18px; color: var(--text-muted); margin-bottom: 30px;">Importer of high-end Anime figures, Portrait Vending Kiosks, and Licensed plushies for the Indian market.</p>
    <a href="#products" style="background: var(--yellow); color: var(--dark); padding: 15px 35px; border-radius: 50px; text-decoration: none; font-weight: 900; letter-spacing: 1px;">EXPLORE CATALOG</a>
  </div>
</section>

<div class="ticker">
